name: Bug report
description: Report a reproducible GUI, CLI, image processing or model format problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Do not upload private images or proprietary model checkpoints.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python / PyTorch / OS / GPU versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error output

